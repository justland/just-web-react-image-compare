name: release
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - releases/*

jobs:
  code:
    uses: justland/.github/.github/workflows/pnpm-verify.yml@main
    with:
      os: '["ubuntu-latest"]'

  release:
    uses: justland/.github/.github/workflows/pnpm-release-changeset-oidc.yml@main
    needs: code
    # Declared on the job, not the workflow: a called workflow can only narrow
    # what its caller was granted, and the callee needs contents + pull-requests
    # to push the version branch and open the version PR.
    permissions:
      id-token: write
      contents: write
      pull-requests: write

  docgen:
    permissions:
      contents: write
    uses: justland/.github/.github/workflows/pnpm-docs.yml@main
    needs: release
    if: github.ref == 'refs/heads/main'
    with:
      publish-dir: ./packages/react-image-compare/storybook-static
